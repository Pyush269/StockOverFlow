apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stockflow.fullname" . }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stockflow.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  wait-for-schema.py: |
    import os
    import time
    from alembic.script import ScriptDirectory
    from sqlalchemy import create_engine, text
    from sqlalchemy.exc import SQLAlchemyError

    engine = create_engine(os.environ["DATABASE_URL"], connect_args={"connect_timeout": 3})
    expected = set(ScriptDirectory("/app/alembic").get_heads())
    deadline = time.monotonic() + 300
    while True:
        try:
            with engine.connect() as connection:
                actual = set(connection.scalars(text("SELECT version_num FROM alembic_version")))
            if actual == expected:
                print("Database schema is current", flush=True)
                break
        except SQLAlchemyError:
            pass
        if time.monotonic() >= deadline:
            raise SystemExit("Database schema was not ready within 300 seconds")
        time.sleep(2)
    engine.dispose()
  migrate.py: |
    import os
    import subprocess
    import time
    from sqlalchemy import create_engine, text
    from sqlalchemy.exc import SQLAlchemyError

    engine = create_engine(os.environ["DATABASE_URL"], connect_args={"connect_timeout": 3})
    deadline = time.monotonic() + 180
    while True:
        try:
            connection = engine.connect()
            connection.execute(text("SELECT 1"))
            break
        except SQLAlchemyError:
            if time.monotonic() >= deadline:
                raise SystemExit("Database was not ready within 180 seconds")
            time.sleep(2)
    # Hold an advisory lock across Alembic so overlapping releases cannot migrate concurrently.
    try:
        connection.execute(text("SELECT pg_advisory_lock(1942150148)"))
        subprocess.run(["python", "-m", "alembic", "upgrade", "head"], check=True)
    finally:
        connection.close()
        engine.dispose()
