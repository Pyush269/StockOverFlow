apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stockflow.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stockflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      {{- include "stockflow.selector" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "stockflow.selector" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: {{ include "stockflow.fullname" . }}
      automountServiceAccountToken: false
      {{- include "stockflow.pullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "stockflow.podSecurity" . | nindent 8 }}
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: frontend
          image: {{ include "stockflow.frontendImage" . | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - |
              export NGINX_RESOLVER="$(awk '/^nameserver/{print $2; exit}' /etc/resolv.conf)"
              exec /usr/local/bin/stockflow-entrypoint nginx -g 'daemon off;'
          env:
            - name: API_UPSTREAM
              value: {{ printf "%s-backend.%s.svc.cluster.local:8000" (include "stockflow.fullname" .) .Release.Namespace | quote }}
          securityContext:
            {{- include "stockflow.containerSecurity" . | nindent 12 }}
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stockflow.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stockflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  type: ClusterIP
  selector:
    {{- include "stockflow.selector" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - {name: http, port: 80, targetPort: http}
