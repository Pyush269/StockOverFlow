{{- if ne .Values.backend.image.tag .Values.frontend.image.tag }}
{{- fail "backend and frontend must use the same published source SHA" }}
{{- end }}
{{- if gt (int .Values.autoscaling.minReplicas) (int .Values.autoscaling.maxReplicas) }}
{{- fail "autoscaling.maxReplicas must be at least minReplicas" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stockflow.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stockflow.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
