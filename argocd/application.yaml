apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stockflow
  namespace: argocd
  # No cascading finalizer: deleting this object alone must not delete inventory.
spec:
  project: stockflow
  source:
    repoURL: https://github.com/Pyush269/StockOverFlow.git
    targetRevision: main
    path: helm/stockflow
    helm:
      releaseName: stockflow
      valueFiles:
        - values-prod.yaml
        - values-release.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: stockflow
  syncPolicy:
    # Start manually. Enable automated reconciliation after initial verification.
    syncOptions:
      - RespectIgnoreDifferences=true
      - FailOnSharedResource=true
      - PruneLast=true
    retry:
      limit: 3
      backoff: {duration: 5s, factor: 2, maxDuration: 1m}
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: stockflow-stockflow-backend
      jsonPointers: [/spec/replicas]
