# Single-replica capstone profile; access only through kubectl port-forward.
global:
  domain: ""
configs:
  params:
    server.insecure: false
dex:
  enabled: false
notifications:
  enabled: false
redis-ha:
  enabled: false
controller:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 300m, memory: 384Mi}
redis:
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
server:
  replicas: 1
  service:
    type: ClusterIP
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 300m, memory: 192Mi}
repoServer:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 384Mi}
applicationSet:
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 200m, memory: 192Mi}
