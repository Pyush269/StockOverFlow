# clusterName, region and vpcId come from Terraform; Pod Identity binds the service account below.
replicaCount: 1
enableShield: false
enableWaf: false
enableWafv2: false
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 300m, memory: 192Mi}
serviceAccount:
  create: true
  name: aws-load-balancer-controller
