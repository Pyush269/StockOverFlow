name: stockflow-tests
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockflow_test
      POSTGRES_USER: stockflow_test
      # Public test-only credentials, for this disposable loopback-only service.
      POSTGRES_PASSWORD: stockflow_test_only
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow_test -d stockflow_test"]
      interval: 2s
      timeout: 3s
      retries: 30
