name: StockFlow CI

on:
  pull_request:
    paths-ignore:
      - 'helm/**'
      - 'argocd/**'
      - 'monitoring/**'
      - 'k8s/**'
      - 'terraform/**'
      - 'docs/**'
      - 'demo/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'scripts/*gitops*'
      - 'scripts/*monitoring*'
      - 'scripts/load-test*'
      - '.github/workflows/helm.yml'
      - '.github/workflows/terraform.yml'
      - '.github/workflows/gitops.yml'
  push:
    branches: [main]
  workflow_dispatch:

# PR code never receives package write access or persisted Git credentials.
permissions:
  contents: read

concurrency:
  group: stockflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: PostgreSQL tests and frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: stockflow_test
          POSTGRES_USER: stockflow_test
          POSTGRES_PASSWORD: stockflow_test_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U stockflow_test -d stockflow_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://stockflow_test:stockflow_test_only@127.0.0.1:5432/stockflow_test
      TEST_DATABASE_URL: postgresql+psycopg://stockflow_test:stockflow_test_only@127.0.0.1:5432/stockflow_test
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Install locked backend test dependencies
        run: |
          python -m pip install -r backend/requirements-dev.lock.txt
          python -m pip check
      - name: Upgrade empty database and check schema parity
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Run real PostgreSQL tests, including migration round trip and locking
        working-directory: backend
        run: python -m pytest -v --junitxml=../reports/pytest.xml
      - name: Clean frontend install, unit tests, and production build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          mkdir -p ../reports
          npm test | tee ../reports/frontend-tests.txt
          npm run build | tee ../reports/frontend-build.txt
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.sha }}
          overwrite: true
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  images:
    name: Build once and scan release images
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      backend_id: ${{ steps.package.outputs.backend_id }}
      frontend_id: ${{ steps.package.outputs.frontend_id }}
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
    env:
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_URL: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install checksum-verified Trivy
        run: |
          bash scripts/ci/install-trivy.sh "$RUNNER_TEMP/stockflow-tools"
          echo "$RUNNER_TEMP/stockflow-tools" >> "$GITHUB_PATH"
      - name: Build each image once and load it locally
        run: bash scripts/ci/build-images.sh
      - name: Strict HIGH/CRITICAL gates, including unfixed vulnerabilities
        run: bash scripts/ci/scan-images.sh "stockflow-backend:$SOURCE_SHA" "stockflow-frontend:$SOURCE_SHA"
      - name: Save scan reports even if the gate fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-reports-${{ github.sha }}
          overwrite: true
          path: reports/trivy/
          if-no-files-found: warn
          retention-days: 30
      - name: Export the exact scanned images after both gates pass
        id: package
        run: bash scripts/ci/package-images.sh
      - name: Save verified release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-images-${{ github.sha }}
          overwrite: true
          path: release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish scanned images to GHCR
    needs: [tests, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      # No checkout, source scripts, container execution, or rebuild in this job.
      - name: Download this run's verified images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-images-${{ github.sha }}
          path: release
      - name: Verify archive and loaded image identities
        env:
          ARCHIVE_SHA256: ${{ needs.images.outputs.archive_sha256 }}
          BACKEND_ID: ${{ needs.images.outputs.backend_id }}
          FRONTEND_ID: ${{ needs.images.outputs.frontend_id }}
        run: |
          printf '%s  release/images.tar\n' "$ARCHIVE_SHA256" | sha256sum --check --strict
          docker load --input release/images.tar
          test "$(docker image inspect --format '{{.Id}}' "stockflow-backend:$GITHUB_SHA")" = "$BACKEND_ID"
          test "$(docker image inspect --format '{{.Id}}' "stockflow-frontend:$GITHUB_SHA")" = "$FRONTEND_ID"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Tag and push without rebuilding
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf '### Published release\n\nSource commit: `%s`\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          for component in backend frontend; do
            image="ghcr.io/${owner}/stockflow-${component}:${GITHUB_SHA}"
            docker tag "stockflow-${component}:${GITHUB_SHA}" "$image"
            # Retry transient registry/blob failures with the same image bytes.
            for attempt in 1 2 3; do
              if docker push "$image"; then break; fi
              if [[ "$attempt" -eq 3 ]]; then exit 1; fi
              sleep "$((attempt * 5))"
            done
            digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
            printf '%s\n' "$digest" | tee -a release/published-digests.txt
            printf -- '- `%s`\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Save publication receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-${{ github.sha }}
          overwrite: true
          path: |
            release/manifest.txt
            release/published-digests.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Log out
        if: always()
        run: docker logout ghcr.io
